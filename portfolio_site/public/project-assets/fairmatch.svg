  <text x="1076" y="368" fill="#f6f3e8" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800">Publish rosters</text>
  <text x="1076" y="406" fill="#9fb5b0" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600">Sheets · Excel · dashboard</text>

