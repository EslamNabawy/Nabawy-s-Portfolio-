<svg width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">FairMatch team formation thumbnail</title>
  <desc id="desc">Mockup of an n8n pipeline cleaning survey data, solving balanced teams, and publishing fairness-graded rosters.</desc>
  <rect width="1600" height="1000" fill="#07110f"/>
  <path d="M0 170H1600M0 330H1600M0 490H1600M0 650H1600M0 810H1600M180 0V1000M380 0V1000M580 0V1000M780 0V1000M980 0V1000M1180 0V1000M1380 0V1000" stroke="#12352f" stroke-width="2"/>
