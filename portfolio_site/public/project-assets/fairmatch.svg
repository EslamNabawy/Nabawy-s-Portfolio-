<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">FairMatch project thumbnail</title>
  <desc id="desc">Mockup of an n8n team formation engine producing four balanced, fairness-graded teams.</desc>
