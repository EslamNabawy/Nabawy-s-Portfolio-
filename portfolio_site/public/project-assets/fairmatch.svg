  <text x="646" y="368" fill="#f6f3e8" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800">Solve teams</text>
  <text x="646" y="406" fill="#9fb5b0" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600">20 multi-start runs</text>

